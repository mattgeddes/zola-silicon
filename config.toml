# =============================================================================
#  zola-biz — configuration
# =============================================================================
#  This file is the control panel for the template. Everything you are likely
#  to want to change lives here or in content/_index.md — not in templates/.
# =============================================================================

# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------
base_url = "https://kestrel.example.com"
title = "Kestrel"
description = "Observability and edge tooling for small engineering teams."
author = "The Kestrel Team"

# Keep Zola's built-in sitemap (templates/sitemap.xml refines it) and robots file.
generate_sitemap = true
generate_robots_txt = true

# Don't advertise the blog pagination pages (?page=2) to search engines.
exclude_paginated_pages_in_sitemap = "all"

# Build minified HTML. Keep this false while developing so error messages are
# readable; turn it on for production deploys.
minify_html = false

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
[markdown]
# Syntax highlighting is disabled: this template ships its own hand-rolled code
# block styling that adapts to the active theme, so Zola's generated highlight
# CSS would fight with it.
highlight_code = false

# Open links to other sites in a new tab.
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true

# -----------------------------------------------------------------------------
# Feeds — the blog section sets generate_feeds = true in its own front matter
# -----------------------------------------------------------------------------
feed_limit = 20

# -----------------------------------------------------------------------------
# Sections
# -----------------------------------------------------------------------------
# Every top-level directory in content/ that contains an _index.md file is a
# Zola "section". The four switches below control whether each one appears in
# the site.
#
#   true  -> linked in the header nav + footer, included in the sitemap,
#            and the pages are rendered.
#   false -> unlinked everywhere, dropped from the sitemap, and any direct URL
#            to one of its pages bounces the visitor back to the home page.
#
# To use a completely different nav structure, reorder nav below rather than
# turning things on and off.
#
# Note that this only hides a section from the site's own navigation. Links you
# write *inside* page content (a "Read more" button pointing at /products/,
# say) are yours to remove — grep your content folder for the section name
# after switching one off.
# -----------------------------------------------------------------------------
[extra]
# Number of blog posts shown on the home page.
latest_posts = 3

# Shown in the footer. Bump this each January.
copyright_year = 2026

[extra.sections]
products = true
services = true
blog = true
contact = true

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
# Each entry is a path relative to the site root. "key" must match a key in
# [extra.sections] above for the link to be shown, so removing a section from
# the nav is a single edit in either table.
# -----------------------------------------------------------------------------
[[extra.nav]]
key = "products"
label = "Products"
url = "/products/"

[[extra.nav]]
key = "services"
label = "Services"
url = "/services/"

[[extra.nav]]
key = "blog"
label = "Blog"
url = "/blog/"

[[extra.nav]]
key = "contact"
label = "Contact"
url = "/contact/"

# Always shown, regardless of [extra.sections]. Delete this entry, or add your
# own `key`/`label`/`url` triples above it, to shape the nav however you like.
[[extra.nav]]
label = "FAQ"
url = "/#faq"

# -----------------------------------------------------------------------------
# Brand
# -----------------------------------------------------------------------------
[extra.brand]
name = "Kestrel"
# Rendered after the name in the header logo. Leave empty for a logotype.
suffix = "Labs"
# Two or three hex colours used for the generated favicon/OG artwork.
primary = "#137C7A"   # Secure Teal
accent = "#39C6D6"    # Signal Cyan

# -----------------------------------------------------------------------------
# Contact details — used by the contact page and the site footer.
# -----------------------------------------------------------------------------
[extra.contact]
email = "hello@kestrel.example.com"
phone = "+1 (415) 555-0142"
address = "Studio 4, Pier 9\\nSan Francisco, CA 94111"
hours = "Mon–Fri, 09:00–18:00 PT"

# -----------------------------------------------------------------------------
# Footer link columns
# -----------------------------------------------------------------------------
[[extra.footer_links]]
heading = "Product"
links = [
  { label = "Overview", url = "/products/" },
  { label = "Contact", url = "/contact/" },
]

[[extra.footer_links]]
heading = "Company"
links = [
  { label = "Blog", url = "/blog/" },
  { label = "Contact", url = "/contact/" },
]

[[extra.footer_links]]
heading = "Legal"
links = [
  { label = "Privacy", url = "/privacy/" },
  { label = "Terms", url = "/terms/" },
]

# -----------------------------------------------------------------------------
# Social links — icon names come from templates/partials/icons.html
# -----------------------------------------------------------------------------
[[extra.social]]
icon = "github"
label = "GitHub"
url = "https://github.com/"

[[extra.social]]
icon = "mastodon"
label = "Mastodon"
url = "https://mastodon.social/"

[[extra.social]]
icon = "linkedin"
label = "LinkedIn"
url = "https://www.linkedin.com/"

[[extra.social]]
icon = "rss"
label = "Atom feed"
url = "/blog/atom.xml"

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------