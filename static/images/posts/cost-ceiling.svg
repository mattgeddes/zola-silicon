<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A usage chart clamped at a fixed daily ceiling">
  <title>Cost ceiling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2350"/>
      <stop offset=".55" stop-color="#31204a"/>
      <stop offset="1" stop-color="#0f3a3f"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".055" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>
  <!-- ceiling -->
  <path d="M64 130h1072" stroke="#fbbf24" stroke-opacity=".8" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="880" y="108" width="256" height="34" rx="17" fill="#fbbf24" fill-opacity=".2"/>
  <rect x="904" y="120" width="132" height="10" rx="5" fill="#fbbf24" fill-opacity=".65"/>

  <!-- usage bars, clamped at the ceiling -->
  <g>
    <rect x="96" y="390" width="30" height="40" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="140" y="390" width="30" height="40" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="184" y="388" width="30" height="42" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="228" y="386" width="30" height="44" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="272" y="383" width="30" height="47" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="316" y="379" width="30" height="51" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="360" y="374" width="30" height="56" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="404" y="368" width="30" height="62" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="448" y="362" width="30" height="68" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="492" y="355" width="30" height="75" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="536" y="347" width="30" height="83" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="580" y="338" width="30" height="92" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="624" y="329" width="30" height="101" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="668" y="319" width="30" height="111" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="712" y="308" width="30" height="122" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="756" y="296" width="30" height="134" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="800" y="284" width="30" height="146" rx="8" fill="#818cf8" fill-opacity="0.55"/>
    <rect x="844" y="271" width="30" height="159" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
    <rect x="888" y="257" width="30" height="173" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
    <rect x="932" y="243" width="30" height="187" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
    <rect x="976" y="227" width="30" height="203" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
    <rect x="1020" y="212" width="30" height="218" rx="8" fill="#fbbf24" fill-opacity="0.3"/>
  </g>

  <!-- baseline -->
  <path d="M64 430h1072" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>

  <!-- the spike, held flat -->
  <circle cx="859" cy="146" r="7" fill="#fbbf24"/>
  <circle cx="859" cy="146" r="16" fill="#fbbf24" fill-opacity=".2"/>

  <!-- annotation -->
  <rect x="96" y="470" width="440" height="12" rx="6" fill="#ffffff" fill-opacity=".18"/>
  <rect x="96" y="496" width="304" height="12" rx="6" fill="#ffffff" fill-opacity=".1"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
