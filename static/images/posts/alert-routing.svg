<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Six alert paths converging on a single notification">
  <title>Alert routing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#221f4d"/>
      <stop offset=".55" stop-color="#3a1f47"/>
      <stop offset="1" stop-color="#123543"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".055" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>
  <g>
    <path d="M80 150H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="150" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="150" r="4" fill="#ffffff" fill-opacity=".5"/>
    <path d="M80 210H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.76" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="210" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="210" r="4" fill="#ffffff" fill-opacity=".5"/>
    <path d="M80 270H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.67" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="270" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="270" r="4" fill="#ffffff" fill-opacity=".5"/>
    <path d="M80 330H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.58" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="330" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="330" r="4" fill="#ffffff" fill-opacity=".5"/>
    <path d="M80 390H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.49" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="390" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="390" r="4" fill="#ffffff" fill-opacity=".5"/>
    <path d="M80 450H400c60 0 90 90 150 90" fill="none" stroke="url(#flow)" stroke-opacity="0.40" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="450" r="11" fill="#ffffff" fill-opacity=".12"/>
    <circle cx="80" cy="450" r="4" fill="#ffffff" fill-opacity=".5"/>
  </g>

  <!-- single converged destination -->
  <circle cx="620" cy="315" r="54" fill="url(#flow)" fill-opacity=".18"/>
  <circle cx="620" cy="315" r="34" fill="url(#flow)"/>
  <path d="M620 297l-12 16h8l-1.5 13 13-17h-8l.5-12Z" fill="#141830"/>

  <!-- one notification, many signals -->
  <rect x="740" y="243" width="380" height="144" rx="20" fill="#ffffff" fill-opacity=".07"/>
  <rect x="740" y="243" width="380" height="144" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="768" y="271" width="88" height="9" rx="4.5" fill="#ffffff" fill-opacity=".45"/>
  <g fill="#ffffff" fill-opacity=".22">
    <rect x="768" y="300" width="324" height="7" rx="3.5"/>
    <rect x="768" y="318" width="268" height="7" rx="3.5"/>
    <rect x="768" y="336" width="196" height="7" rx="3.5"/>
  </g>
  <rect x="768" y="358" width="64" height="14" rx="7" fill="#fbbf24" fill-opacity=".35"/>
  <circle cx="1112" cy="315" r="26" fill="#34d399" fill-opacity=".22"/>
  <path d="M1102 315l7 7 13-14" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
