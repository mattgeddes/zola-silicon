<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="One request fanning out to regions of a content source">
  <title>Edge logic</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202653"/>
      <stop offset=".55" stop-color="#251f52"/>
      <stop offset="1" stop-color="#0d3644"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".055" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>
  <!-- incoming request -->
  <g>
    <circle cx="200" cy="315" r="42" fill="url(#flow)" fill-opacity=".2"/>
    <circle cx="200" cy="315" r="26" fill="url(#flow)"/>
    <path d="M190 302l20 13-20 13v-9l-12 0 12 0v-8Z" fill="#141830"/>
  </g>

  <!-- fan out -->
  <g>
    <path d="M300 315C450 315 520 210 714 210" fill="none" stroke="url(#flow)" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="730" cy="210" r="5" fill="#818cf8"/>
    <rect x="760" y="166" width="196" height="88" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <rect x="760" y="166" width="196" height="88" rx="16" fill="none" stroke="#818cf8" stroke-opacity=".4"/>
    <rect x="782" y="188" width="86" height="8" rx="4" fill="#ffffff" fill-opacity=".4"/>
    <rect x="782" y="208" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="782" y="228" width="108" height="7" rx="3.5" fill="#ffffff" fill-opacity=".14"/>
    <path d="M300 315C450 315 520 315 804 315" fill="none" stroke="url(#flow)" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="820" cy="315" r="5" fill="#22d3ee"/>
    <rect x="850" y="271" width="196" height="88" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <rect x="850" y="271" width="196" height="88" rx="16" fill="none" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect x="872" y="293" width="86" height="8" rx="4" fill="#ffffff" fill-opacity=".4"/>
    <rect x="872" y="313" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="872" y="333" width="108" height="7" rx="3.5" fill="#ffffff" fill-opacity=".14"/>
    <path d="M300 315C450 315 520 420 894 420" fill="none" stroke="url(#flow)" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="910" cy="420" r="5" fill="#a78bfa"/>
    <rect x="940" y="376" width="196" height="88" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <rect x="940" y="376" width="196" height="88" rx="16" fill="none" stroke="#a78bfa" stroke-opacity=".4"/>
    <rect x="962" y="398" width="86" height="8" rx="4" fill="#ffffff" fill-opacity=".4"/>
    <rect x="962" y="418" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="962" y="438" width="108" height="7" rx="3.5" fill="#ffffff" fill-opacity=".14"/>
    <path d="M300 315C450 315 520 525 984 525" fill="none" stroke="url(#flow)" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1000" cy="525" r="5" fill="#34d399"/>
    <rect x="1030" y="481" width="196" height="88" rx="16" fill="#ffffff" fill-opacity=".07"/>
    <rect x="1030" y="481" width="196" height="88" rx="16" fill="none" stroke="#34d399" stroke-opacity=".4"/>
    <rect x="1052" y="503" width="86" height="8" rx="4" fill="#ffffff" fill-opacity=".4"/>
    <rect x="1052" y="523" width="140" height="7" rx="3.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="1052" y="543" width="108" height="7" rx="3.5" fill="#ffffff" fill-opacity=".14"/>
  </g>

  <!-- origin, the one slow box -->
  <rect x="64" y="150" width="272" height="150" rx="18" fill="#ffffff" fill-opacity=".06"/>
  <rect x="64" y="150" width="272" height="150" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
  <rect x="92" y="176" width="104" height="9" rx="4.5" fill="#ffffff" fill-opacity=".4"/>
  <g fill="#ffffff" fill-opacity=".18">
    <rect x="92" y="206" width="216" height="7" rx="3.5"/>
    <rect x="92" y="226" width="168" height="7" rx="3.5"/>
  </g>
  <circle cx="300" cy="262" r="6" fill="#fb7185"/>
  <rect x="92" y="256" width="120" height="7" rx="3.5" fill="#fb7185" fill-opacity=".5"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
