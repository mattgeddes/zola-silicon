<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="Stylised observability dashboard">
  <title>Kestrel Observe dashboard</title>
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="720" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232a52"/>
      <stop offset=".55" stop-color="#2b1f4e"/>
      <stop offset="1" stop-color="#10333f"/>
    </linearGradient>
    <linearGradient id="hd-area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#818cf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hd-spark" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="hd-bar" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#22d3ee" stop-opacity=".85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/>
    </linearGradient>
    <clipPath id="hd-clip"><rect x="24" y="24" width="672" height="492" rx="18"/></clipPath>
  </defs>

  <rect width="720" height="540" rx="20" fill="url(#hd-bg)"/>

  <g clip-path="url(#hd-clip)">
    <!-- faint plot grid -->
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1">
      <path d="M24 150h672M24 210h672M24 270h672M24 330h672M24 390h672"/>
      <path d="M150 24v492M300 24v492M450 24v492M600 24v492"/>
    </g>

    <!-- title bar -->
    <rect x="24" y="24" width="672" height="44" fill="#ffffff" fill-opacity=".05"/>
    <circle cx="48" cy="46" r="5" fill="#fb7185"/>
    <circle cx="66" cy="46" r="5" fill="#fbbf24"/>
    <circle cx="84" cy="46" r="5" fill="#34d399"/>
    <rect x="112" y="38" width="128" height="16" rx="8" fill="#ffffff" fill-opacity=".14"/>
    <rect x="612" y="38" width="60" height="16" rx="8" fill="#ffffff" fill-opacity=".1"/>

    <!-- KPI tiles -->
    <g>
      <rect x="48" y="96" width="196" height="76" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="64" y="112" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".3"/>
      <rect x="64" y="132" width="88" height="16" rx="8" fill="#ffffff" fill-opacity=".82"/>
      <rect x="64" y="152" width="44" height="8" rx="4" fill="#34d399" fill-opacity=".8"/>
    </g>
    <g>
      <rect x="262" y="96" width="196" height="76" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="278" y="112" width="72" height="8" rx="4" fill="#ffffff" fill-opacity=".3"/>
      <rect x="278" y="132" width="96" height="16" rx="8" fill="#ffffff" fill-opacity=".82"/>
      <rect x="278" y="152" width="36" height="8" rx="4" fill="#22d3ee" fill-opacity=".8"/>
    </g>
    <g>
      <rect x="476" y="96" width="196" height="76" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <rect x="492" y="112" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".3"/>
      <rect x="492" y="132" width="72" height="16" rx="8" fill="#ffffff" fill-opacity=".82"/>
      <rect x="492" y="152" width="52" height="8" rx="4" fill="#a78bfa" fill-opacity=".8"/>
    </g>

    <!-- latency chart -->
    <rect x="48" y="196" width="404" height="200" rx="14" fill="#ffffff" fill-opacity=".05"/>
    <rect x="64" y="212" width="84" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>

    <!-- p99 band -->
    <path d="M64 330c40-6 62-52 96-70s58 6 84-16 44-58 78-64 58 34 88 8v96H64Z" fill="url(#hd-area)"/>
    <path d="M64 330c40-6 62-52 96-70s58 6 84-16 44-58 78-64 58 34 88 8"
          fill="none" stroke="url(#hd-spark)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="410" cy="188" r="4" fill="#22d3ee"/>
    <circle cx="410" cy="188" r="9" fill="#22d3ee" fill-opacity=".2"/>

    <!-- threshold line -->
    <path d="M64 262h372" stroke="#fbbf24" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="356" y="246" width="80" height="16" rx="8" fill="#fbbf24" fill-opacity=".18"/>
    <rect x="364" y="251" width="44" height="6" rx="3" fill="#fbbf24" fill-opacity=".7"/>

    <!-- bar chart -->
    <rect x="470" y="196" width="202" height="200" rx="14" fill="#ffffff" fill-opacity=".05"/>
    <rect x="486" y="212" width="64" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
    <g fill="url(#hd-bar)">
      <rect x="488" y="330" width="18" height="42" rx="5"/>
      <rect x="514" y="304" width="18" height="68" rx="5"/>
      <rect x="540" y="318" width="18" height="54" rx="5"/>
      <rect x="566" y="272" width="18" height="100" rx="5"/>
      <rect x="592" y="296" width="18" height="76" rx="5"/>
      <rect x="618" y="250" width="18" height="122" rx="5"/>
    </g>

    <!-- service map -->
    <rect x="48" y="414" width="624" height="78" rx="14" fill="#ffffff" fill-opacity=".05"/>
    <g stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5">
      <path d="M132 453h72M264 453h66M390 453h60"/>
    </g>
    <g>
      <circle cx="112" cy="453" r="17" fill="#818cf8"/>
      <circle cx="246" cy="453" r="17" fill="#22d3ee"/>
      <circle cx="372" cy="453" r="17" fill="#a78bfa"/>
      <circle cx="492" cy="453" r="17" fill="#34d399"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
      <path d="M204 453h24M336 453h18M450 453h24"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="718.5" height="538.5" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
</svg>